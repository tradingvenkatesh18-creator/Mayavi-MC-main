    // Audio engine
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSlateClick() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(840, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.07);

      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.07);
    }

    document.getElementById('sound-toggle-btn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle-btn').style.opacity = soundEnabled ? '1' : '0.35';

                  </div>
                  <div class="p-4 rounded-xl bg-white/[0.02] border border-white/10 space-y-1">
                    <div class="font-mono text-[9px] tracking-widest text-amber-400 uppercase">COLOR SCIENCE LUT</div>
                    <p class="font-body text-xs text-white/80 leading-relaxed">
                      Optimal grading: LOG-C to REC2020 with Kodak 5207 warm skin tones and desaturated shadows.
                    </p>
                  </div>
                </div>
              </div>

              <!-- PANE 4: CASTING -->
              <div id="pane-4" class="eval-pane hidden space-y-5">
                <div class="font-mono text-[9px] tracking-widest text-amber-400 uppercase">
                  // ROLES & SCRIPT COMPATIBILITY
                </div>
                <div class="space-y-2">
                  <div class="font-display font-bold text-base text-white">Prime Casting Matches for Your Archetype:</div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${roles.map(r => `
                      <div class="p-3.5 rounded-xl bg-white/[0.02] border border-white/10 flex items-center gap-3">
                        <span class="text-amber-400 font-bold">🎬</span>
                        <span class="font-display font-semibold text-xs text-white/95">${r}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div class="p-4 rounded-xl bg-amber-500/[0.06] border border-amber-400/25">
                  <div class="font-mono text-[9px] tracking-widest text-[#EAB308] uppercase mb-1">
                    RECOMMENDED ACADEMY COHORT:
                  </div>
                  <div class="font-display font-semibold text-base text-white">
                    ${track}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Submission Buttons -->
          <div class="flex flex-wrap gap-4 pt-2">
            <a href="https://wa.me/919999999999?text=Hello%20Mayavi%20Casting%2C%20I%20have%20completed%20the%20Director%27s%20Room%20Screen%20Test%3A%20${encodeURIComponent(title)}" target="_blank" class="next-pill-btn px-8 py-3.5 rounded-full font-mono text-xs tracking-widest uppercase font-bold inline-flex items-center gap-2">
              <span>SUBMIT AUDITION TO DIRECTORS VIA WHATSAPP</span>
              <span>→</span>
            </a>
            <button onclick="window.print()" class="px-6 py-3.5 rounded-full border border-white/10 hover:border-white/30 font-mono text-xs tracking-widest uppercase text-white/70 hover:text-white transition-colors cursor-pointer">
              PRINT DOSSIER
            </button>
            <button onclick="location.reload()" class="px-6 py-3.5 rounded-full border border-white/10 hover:border-white/30 font-mono text-xs tracking-widest uppercase text-white/70 hover:text-white transition-colors cursor-pointer">
              RETAKE SCREEN TEST
            </button>
          </div>
        </div>
      `;

      // Setup Tab Switching Logic
      const tabs = [
        { btn: document.getElementById('tab-btn-1'), pane: document.getElementById('pane-1') },
        { btn: document.getElementById('tab-btn-2'), pane: document.getElementById('pane-2') },
        { btn: document.getElementById('tab-btn-3'), pane: document.getElementById('pane-3') },
        { btn: document.getElementById('tab-btn-4'), pane: document.getElementById('pane-4') }
      ];

      tabs.forEach((tab, tIdx) => {
        if (!tab.btn) return;
        tab.btn.addEventListener('click', () => {
          playSlateClick();
          tabs.forEach(t => {
            t.pane.classList.add('hidden');
            t.btn.classList.remove('active', 'border-amber-400', 'text-amber-400', 'bg-amber-400/[0.08]', 'font-bold');
            t.btn.classList.add('border-transparent', 'text-white/50');
          });
          tab.pane.classList.remove('hidden');
          tab.btn.classList.add('active', 'border-amber-400', 'text-amber-400', 'bg-amber-400/[0.08]', 'font-bold');
          tab.btn.classList.remove('border-transparent', 'text-white/50');
        });
      });
    }

    // Initialize
    renderCurrentScene();
  </script>
</body>
</html>
